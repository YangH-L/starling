[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starling-client"
dynamic = ["version"]
description = "Pure-Python client for the Starling memory service"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["starling_client"]

[tool.setuptools.dynamic]
version = {attr = "starling_client._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
